[project]
name = "halo-server"
version = "0.1.0"
description = "Headless Ring event and media backend for Halo integrations"
authors = [{ name = "JamesFromFL" }]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.11,<3.15"
keywords = ["home-automation", "homekit", "ring", "scrypted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "aiohttp>=3.14.2,<3.15",
    "aiortc==1.14.0",
    "av>=14.0,<17",
    "cryptography>=50.0.0,<51",
    "numpy>=1.26,<2.6",
    "pyopenssl>=26.4.0,<27",
    "ring-doorbell==0.9.14",
    "textual>=8.2.8,<9",
]

[project.scripts]
halo-server = "halo_server.cli:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halo_server"]

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]
audit = [
    "pip-audit==2.10.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
required-version = "==0.11.24"
