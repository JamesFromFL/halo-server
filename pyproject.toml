[project]
name = "halo-server"
version = "0.1.0"
description = "Headless Ring event and media backend for Halo integrations"
authors = [{ name = "JamesFromFL" }]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.11,<3.15"
keywords = ["home-automation", "homekit", "ring", "scrypted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "aiohttp>=3.14.5,<3.15",
    "aiortc==1.15.0",
    "av==17.1.0",
    "cryptography>=50.0.2,<51",
    # Security floors for transitive runtime dependencies also apply to wheels.
    "dnspython>=2.9.2,<3",
    # The per-listener push adapter is qualified against this exact SDK.
    "firebase-messaging==0.4.5",
    "multidict>=6.9.1,<7",
    "numpy>=1.26,<2.6",
    "pyopenssl>=26.4.0,<27",
    "pylibsrtp==1.0.0",
    "ring-doorbell==0.9.14",
    "textual>=8.2.8,<9",
]

[project.scripts]
halo-server = "halo_server.cli:main"
halo-release = "halo_server.release_operator:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halo_server"]

[tool.hatch.build.hooks.custom]

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]
audit = [
    "pip-audit==2.10.1",
    # Tooling-only advisory fixes; these do not enter the runtime wheel.
    "filelock>=4.2.4,<5",
    "msgpack>=1.2.4,<2",
    "pip>=26.2.2,<27",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
required-version = "==0.11.24"
