[project]
name = "halo-server"
version = "0.1.0"
description = "Headless Ring event and media backend for Halo integrations"
authors = [{ name = "JamesFromFL" }]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.2",
    "aiortc>=1.14.0,<1.15",
    "av>=10.0",
    "numpy>=1.26",
    "ring-doorbell==0.9.14",
    "textual>=8.2.8,<9",
]

[project.scripts]
halo-server = "halo_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halo_server"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]
audit = [
    "pip-audit==2.10.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
